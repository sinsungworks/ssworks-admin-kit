name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing(OIDC). 토큰 시크릿은 쓰지 않는다 — npmjs.com 의 각 패키지 설정에
  # 이 저장소·이 파일(release.yml)이 Trusted Publisher 로 등록돼 있어야 발행된다.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # 🔴 registry-url 을 넣지 않는다. 넣으면 setup-node 가 `_authToken=${NODE_AUTH_TOKEN}`
          #    .npmrc 와 가짜 토큰을 심어, OIDC 가 실패했을 때 원인이 엉뚱한 401 로 가려진다.

      - run: pnpm install --frozen-lockfile

      # changeset 이 쌓여 있으면 "Version Packages" PR 을 열고, 그 PR 이 합쳐진
      # 커밋이면 npm 에 발행한다. NPM_TOKEN 이 없으면 changesets/action 이 OIDC 로 간다.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
